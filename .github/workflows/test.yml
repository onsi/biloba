name: test

on:
  push:
  pull_request:
  # The Release workflow calls this one, so nothing is released unless all of it passes.
  workflow_call:

jobs:
  mod:
    runs-on: ubuntu-latest
    name: Check modules
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - run: go mod tidy && git diff --exit-code go.mod go.sum
    - run: make check-plugins

  docs:
    runs-on: ubuntu-latest
    name: Build docs
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
    steps:
    - uses: actions/checkout@v5
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    - run: bundle exec jekyll build --source docs --destination _site

  build:
    runs-on: ubuntu-latest
    name: Test (default chrome-headless-shell)
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - run: go vet ./...
    # Ubuntu 23.10+ (the ubuntu-latest runner) restricts unprivileged user namespaces via
    # AppArmor, which Chrome's sandbox needs to start. Biloba itself now auto-adds --no-sandbox
    # on a restricted host, but relaxing this here keeps this lane covering the sandbox-ON path -
    # a real sandboxed Chrome, the same as most users' hosts.
    # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    # default (pragmatic) mode: the suite auto-installs chrome-headless-shell via Chrome for Testing.
    # --poll-progress-after dumps the running spec's goroutine stack if a spec ever wedges, and
    # --timeout bounds the suite so a hang fails fast instead of burning the 1h default.
    - run: go run github.com/onsi/ginkgo/v2/ginkgo -r --randomize-all --randomize-suites --fail-on-pending --keep-going --race -procs=2 --poll-progress-after=30s --timeout=8m

  high-fidelity:
    runs-on: ubuntu-latest
    name: Test (high-fidelity headless)
    env:
      # drive the suite through the full ("new") headless Chrome path (uses the runner's
      # pre-installed google-chrome) so both fidelity modes stay green
      BILOBA_TEST_HIGH_FIDELITY: "true"
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    # Ubuntu 23.10+ (the ubuntu-latest runner) restricts unprivileged user namespaces via
    # AppArmor, which Chrome's sandbox needs to start. Biloba itself now auto-adds --no-sandbox
    # on a restricted host, but relaxing this here keeps this lane covering the sandbox-ON path -
    # a real sandboxed Chrome, the same as most users' hosts.
    # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    # Runs in parallel like the default lane. Concurrent remote-allocator attaches are handled by
    # ConnectToChrome's retry/backoff; the one-time full google-chrome launch gets a roomier
    # WSURLReadTimeout (see SpinUpChrome) since a cold runner can take >20s to expose DevTools.
    - run: go run github.com/onsi/ginkgo/v2/ginkgo -r --randomize-all --randomize-suites --fail-on-pending --keep-going --race -procs=2 --poll-progress-after=30s --timeout=8m

  driver:
    runs-on: ubuntu-latest
    name: Test (TypeScript driver + daemon)
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: typescript/package.json
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: typescript/pnpm-lock.yaml
    # See the note in the build job: relaxing this keeps this lane covering the sandbox-ON path
    # too, rather than Biloba's own auto --no-sandbox fallback.
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    # The Go suites provision their own shell, but driver-parity and driver-e2e start daemons from
    # TypeScript, which does not.  Populating the puppeteer cache that engine.LocateChrome searches
    # covers those, and lets the Go suites here skip the download entirely.
    - run: npx -y @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer"
    # Regenerated protocol types/goldens must match what is committed, TypeScript must typecheck
    # and build, and the Go driver packages must pass - including the engine suite's guard that
    # engine/biloba.js has not drifted from the canonical biloba.js.
    - run: make driver-test
    # The real daemon, driving a real shared Chrome, reaching the same observable outcome as the
    # Go API.  Fails (not skips) if it is not configured.
    - run: make driver-parity
    # The shipping topology: three worker processes, one daemon each, one shared Chrome.
    - run: make driver-e2e

  packaging:
    runs-on: ubuntu-latest
    name: Packaging check (Node ${{ matrix.node }}, ${{ matrix.vitest }})
    strategy:
      fail-fast: false
      matrix:
        include:
        # The floor biloba supports, and what `npm install -D vitest biloba` gives a user today.
        - {node: 20, vitest: vitest@3}
        - {node: 22, vitest: vitest@latest}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: typescript/package.json
    # pnpm 11 needs Node >= 22.13 to build the packages; the matrix Node only installs and runs them.
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: typescript/pnpm-lock.yaml
    - run: make npm-pack
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node }}
    # Installs biloba plus this runner's platform package into an empty project the way a user
    # would, type-checks it, runs `npx biloba install-chrome`, then one Vitest spec against a real
    # page.  Deliberately no AppArmor sysctl here (the other jobs have one): this job is a stock
    # runner, like a user's, so it proves Biloba's own auto --no-sandbox fallback (see
    # ChromeSandboxDisabled) is what lets Chrome launch here, with no sysctl step required.
    - run: scripts/packaging-check.sh "$VITEST"
      env:
        VITEST: ${{ matrix.vitest }}
